# Paid, manually triggered real-model smoke test: one paginator task on Claude Haiku 5.5.
#
# Security model (see docs/LIVE_SMOKE.md for the one-time GitHub setup):
# - Trigger: workflow_dispatch only. GitHub only offers it for workflows on the default
#   branch, and both jobs refuse any ref other than refs/heads/main.
# - Two jobs on separate runners. `verify` has no environment and therefore no access to
#   the secret; it runs all tests and isolation checks. `smoke` starts on a fresh VM
#   after `verify` passes, so nothing the test suite did can persist into it.
# - Secret: ANTHROPIC_API_KEY lives only in the `sandbox-agent-eval` environment, which
#   restricts deployments to `main` and requires a reviewer (approval is requested when
#   `smoke` starts, i.e. after `verify` has passed). That environment policy is the
#   control that also covers a modified copy of this file on another branch.
# - Pinning: the operator passes the exact reviewed commit SHA; both jobs refuse to run
#   if main has moved. All actions are pinned to full commit SHAs, and uv is pinned to
#   one release whose download is checked against a pinned sha256.
# - In `smoke`, the secret reaches three steps only (presence check, paid run, artifact
#   scan), after an integrity gate (step-environment fingerprint, clean tree, fresh
#   cache-free venv). The controller passes no host environment to Docker; each sandbox
#   container's environment is verified (inspect) and attested (PID 1) to be exactly the
#   six configured variables. Artifacts are scanned for the key before upload.
name: live-smoke (manual, paid)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full SHA of the reviewed commit on main to run (the job refuses any other)"
        required: true
        type: string
      confirm:
        description: "Type RUN-PAID-HAIKU-SMOKE to confirm one paid request budget of <= $0.50"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sandbox-agent-eval
  cancel-in-progress: false

jobs:
  # ================================================================== no secret access
  verify:
    name: verify (offline + sandbox isolation, no secrets)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'hydrangeas20/sandbox-agent' &&
      github.ref == 'refs/heads/main' &&
      inputs.expected_sha == github.sha &&
      inputs.confirm == 'RUN-PAID-HAIKU-SMOKE'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Guard
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" == "refs/heads/main" ]] || { echo "::error::refusing ref $REF"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_sha must be a full 40-hex SHA"; exit 1; }
          [[ "$EXPECTED_SHA" == "$ACTUAL_SHA" ]] || { echo "::error::main is at $ACTUAL_SHA, not the reviewed $EXPECTED_SHA"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          # Exact uv release, verified against the release's sha256 for
          # uv-x86_64-unknown-linux-gnu.tar.gz. setup-uv v5.4.2 has no built-in
          # checksum for this release, so without `checksum` it would not verify it.
          version: "0.11.32"
          checksum: "aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967"
          python-version: "3.12"
          enable-cache: false

      - name: Install
        run: uv sync --frozen

      - name: Offline checks
        run: uv run pytest -q -m "not docker"

      - name: Build sandbox image
        run: |
          set -euo pipefail
          docker pull python:3.12-slim
          echo "base image digest (audit): $(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)"
          docker build --build-arg BASE_IMAGE=python:3.12-slim -t sandbox-agent-runner:0.1 sandbox

      - name: Sandbox isolation checks
        env:
          SANDBOX_AGENT_REQUIRE_DOCKER: "1" # a missing daemon or image is an error here
        run: |
          uv run sandbox-agent preflight
          uv run pytest -q tests/test_sandbox_docker.py tests/test_security_review_docker.py \
            -k "network or privilege or env or pinned_profile or attestation or pid1"

  # ================================================================== paid, fresh runner
  smoke:
    name: paginator smoke test (claude-haiku-5-5)
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'hydrangeas20/sandbox-agent' &&
      github.ref == 'refs/heads/main' &&
      inputs.expected_sha == github.sha &&
      inputs.confirm == 'RUN-PAID-HAIKU-SMOKE'
    runs-on: ubuntu-24.04
    environment: sandbox-agent-eval
    timeout-minutes: 20
    env:
      SANDBOX_AGENT_RUNS: runs
    steps:
      # ------------------------------------------------------------ no secrets
      - name: Guard (no secrets)
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" == "refs/heads/main" ]] || { echo "::error::refusing ref $REF"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_sha must be a full 40-hex SHA"; exit 1; }
          [[ "$EXPECTED_SHA" == "$ACTUAL_SHA" ]] || { echo "::error::main is at $ACTUAL_SHA, not the reviewed $EXPECTED_SHA"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          # Exact uv release, verified against the release's sha256 for
          # uv-x86_64-unknown-linux-gnu.tar.gz. setup-uv v5.4.2 has no built-in
          # checksum for this release, so without `checksum` it would not verify it.
          version: "0.11.32"
          checksum: "aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967"
          python-version: "3.12"
          enable-cache: false

      # Defence in depth for the few steps that run repository/dependency code in this
      # job before the secret: anything they add via $GITHUB_ENV / $GITHUB_PATH changes
      # this fingerprint (step outputs are immutable), checked by the integrity gate.
      - name: Fingerprint trusted step environment (no secrets)
        id: envsnap
        run: |
          set -euo pipefail
          digest=$( { printf '%s\n' "$PATH"; env | cut -d= -f1 | grep -v -E '^(GITHUB_ACTION|GITHUB_ACTION_PATH|GITHUB_ACTION_REF|GITHUB_ACTION_REPOSITORY|GITHUB_ENV|GITHUB_OUTPUT|GITHUB_PATH|GITHUB_STATE|GITHUB_STEP_SUMMARY|INVOCATION_ID|_|EXPECTED_DIGEST|EXPECTED_SHA)$' | sort; } | sha256sum | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install (no secrets)
        run: uv sync --frozen

      - name: Build sandbox image and preflight (no secrets)
        run: |
          set -euo pipefail
          docker pull python:3.12-slim
          echo "base image digest (audit): $(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)"
          docker build --build-arg BASE_IMAGE=python:3.12-slim -t sandbox-agent-runner:0.1 sandbox
          uv run sandbox-agent preflight

      - name: Integrity gate before the secret is used (no secrets)
        env:
          EXPECTED_DIGEST: ${{ steps.envsnap.outputs.digest }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          digest=$( { printf '%s\n' "$PATH"; env | cut -d= -f1 | grep -v -E '^(GITHUB_ACTION|GITHUB_ACTION_PATH|GITHUB_ACTION_REF|GITHUB_ACTION_REPOSITORY|GITHUB_ENV|GITHUB_OUTPUT|GITHUB_PATH|GITHUB_STATE|GITHUB_STEP_SUMMARY|INVOCATION_ID|_|EXPECTED_DIGEST|EXPECTED_SHA)$' | sort; } | sha256sum | cut -d' ' -f1)
          [[ "$digest" == "$EXPECTED_DIGEST" ]] || { echo "::error::step environment changed after setup (GITHUB_ENV/GITHUB_PATH injection?)"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || { echo "::error::checked-out commit changed"; exit 1; }
          git diff --quiet HEAD -- || { echo "::error::tracked files were modified by an earlier step"; exit 1; }
          # Fresh, cache-free environment from the locked, hash-pinned dependencies.
          rm -rf .venv
          UV_NO_CACHE=1 uv sync --frozen
          rm -rf runs && mkdir runs

      # ------------------------------------------------------------ secret steps
      - name: Require the API key secret
        id: check-secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set in the sandbox-agent-eval environment; refusing to run"
            exit 1
          fi
          echo "API key secret is present (value not shown)."

      - name: Paid smoke test (secret available to the controller only)
        id: smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SANDBOX_AGENT_OFFLINE: "0"
        run: |
          set +e
          uv run --no-sync sandbox-agent run \
            --provider anthropic \
            --model claude-haiku-5-5 \
            --fixture paginator \
            --task "paginate() returns the wrong items: page 1 of 25 items with per_page=10 starts at item 11. Find and fix the bug, then make sure the test suite passes." \
            --max-cost-usd 0.50 \
            --max-model-calls 12 \
            --experiment-budget-usd 0.50 \
            --ledger runs/spend-ledger.json \
            --trace-out runs/smoke.trace.jsonl \
            --json > runs/smoke-result.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "controller exit code: $code (0 = succeeded, 1 = task did not succeed, 2 = error)"
          exit 0

      - name: Scan artifacts for the credential
        id: leakcheck
        if: always() && steps.check-secret.outcome == 'success'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p runs
          uv run --no-sync python scripts/check_artifacts_for_secret.py runs

      # ------------------------------------------------------------ no secrets
      - name: Job summary (no secrets)
        if: always()
        run: uv run --no-sync python scripts/smoke_summary.py runs/smoke-result.json runs/spend-ledger.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted artifacts
        if: always() && steps.leakcheck.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-smoke-${{ github.run_id }}
          path: runs/
          retention-days: 14
          if-no-files-found: warn

      - name: Fail on controller error
        if: steps.smoke.outputs.exit_code != '0' && steps.smoke.outputs.exit_code != '1'
        env:
          EXIT_CODE: ${{ steps.smoke.outputs.exit_code }}
        run: |
          echo "::error::controller exited with ${EXIT_CODE:-none}"
          exit 1
